[package]
name = "ax206mon"
version = "0.3.0"
edition = "2021"
# Kept low on purpose so the distro Rust on AlmaLinux 9/10 can build it.
rust-version = "1.84"
description = "System status dashboard for AX206-protocol USB mini displays (QDtech USB-Display 1908:0102)"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
embedded-graphics = "0.8"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
log = "0.4"
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
signal-hook = "0.3"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
