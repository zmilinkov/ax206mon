# ax206mon configuration (TOML). Every key is optional; the values shown are
# the defaults. Restart the service after editing:
#   sudo systemctl restart ax206mon
#
# Try a page without the display:
#   ax206mon -c this.conf preview --page 2 /tmp/page2.png

[global]
# Clockwise rotation of the picture: 0, 90, 180 or 270.
# 90 and 270 give a portrait layout (270 is the default); 0 and 180 are landscape.
rotate = 270

# Backlight level 0 (off) - 7 (brightest), set when the display is opened.
backlight = 7

# Switch the backlight off when the service stops.
backlight_off_on_exit = true

# Seconds between redraws of the current page. Sending one frame takes
# about 1.2 s, so values below that just mean "as fast as possible".
refresh_interval = 2.0

# Seconds to stay on a page before moving to the next one. A page can
# override this with its own `duration`. With a single page nothing rotates.
page_duration = 15

# Filesystem used by `disk` widgets that don't set their own `path`.
disk_path = "/"

# Network interface for the rx/tx rates in `status`; "" = all except loopback.
net_interface = ""

# Temperature source in millidegrees C, e.g.
# "/sys/class/hwmon/hwmon2/temp1_input"; "" = auto-detect the CPU sensor.
temp_file = ""

# Docker Engine API socket (the service user must be in the `docker` group:
#   sudo usermod -aG docker ax206mon
docker_socket = "/var/run/docker.sock"

# Panel size "WxH"; "" = ask the display (recommended).
size = ""

# Bytes per USB write for frame data (the Windows driver uses 262144).
chunk_size = 262144

# --- Pages ---------------------------------------------------------------
# Pages are shown in order and the clock/date header is on every one of
# them. Remove or reorder [[page]] tables freely; if you define any, the
# built-in pages are replaced.
#
# Widgets are listed top to bottom. Each is either a name ("cpu") or a table
# with options ({ type = "disk", path = "/data", label = "DATA" }).
#
#   cpu           load bar: dark blue = processing, light blue = I/O wait
#   ram           memory bar: apps / system (kernel) / buffers+cache
#   disk          filesystem usage; options: path, label
#   temp          CPU temperature (hidden if no sensor is found)
#   gpu           GPU load plus a second bar; hidden if no GPU is found.
#                 Radeon: graphics load + memory activity (or VRAM use)
#                 Intel Arc (i915): render engine + blitter engine
#                 options: card = "card1", label
#   services      systemd services named as `systemctl list-units -t service`
#                 prints them (e.g. docker.service) with their state. Only
#                 as many as fit on the screen are shown; the rest are dropped.
#                 options: units = ["sshd", "docker.service"] (show exactly
#                 these, in this order, so important ones are never cut), or
#                 filter = "running" (default) | "active" | "failed" | "all"
#                 (sorted failed first, then by name), label
#   network       interfaces that have an IPv4 or IPv6 address, with link
#                 state and addresses (as many as fit; the rest are dropped).
#                 options: loopback = true to include lo, label
#   status        footer line: hostname, uptime, load, network rates
#   docker_status Docker daemon state and container counts
#   docker_stacks running docker compose stacks (running/total containers)
#
# `label` renames the bar on any bar widget.

[[page]]
name = "System"
widgets = ["cpu", "ram", "disk", "temp", "gpu", "status"]

[[page]]
name = "Services"
widgets = ["services"]
# Example: pick the services yourself
# widgets = [{ type = "services", units = ["sshd", "docker", "chronyd"] }]

[[page]]
name = "Network"
widgets = ["network"]

[[page]]
name = "Compose"
widgets = ["docker_stacks"]
# docker_status (daemon state and container counts) can go above it:
# widgets = ["docker_status", "docker_stacks"]
